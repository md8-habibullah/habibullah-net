<!DOCTYPE html>
<html lang="en" data-font="sans" data-pattern="glow">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>habibullah.net has moved to habibullah.dev</title>
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://habibullah.dev/">
  <meta name="theme-color" content="#07101f">
  <link rel="icon" id="icon" href="data:,">
  <!-- Without JavaScript the page still redirects; with it, the script below owns the countdown. -->
  <noscript>
    <meta http-equiv="refresh" content="5;url=https://habibullah.dev/">
    <style>#num, #pause { display: none; }</style>
  </noscript>

  <!-- Picks a random theme before first paint, never the same one twice in a row. -->
  <script>
    (function () {
      // [name, background, text, accent, font]. Everything else is derived in CSS.
      var T = [
        ["Neon Blue", "#07101f", "#e8f1ff", "#3da5ff", "sans"],
        ["Crimson", "#14060a", "#ffeaee", "#ff4d6a", "sans"],
        ["Cyber Purple", "#0e0720", "#f4eaff", "#b46bff", "sans"],
        ["Emerald", "#04120d", "#e6fff4", "#22d98f", "sans"],
        ["Sunset", "#160a04", "#fff1e4", "#ff8a2b", "round"],
        ["Midnight Gold", "#0a0a0f", "#fbf5e3", "#ebbe46", "serif"],
        ["Terminal", "#020802", "#c8ffd8", "#00ff5a", "mono"],
        ["Arctic", "#04141a", "#e4fcff", "#2fe3ee", "sans"],
        ["Rose Neon", "#150812", "#ffeaf7", "#ff62c4", "round"],
        ["Amber CRT", "#120c00", "#ffe9b8", "#ffb000", "mono"],
        ["Lagoon", "#021b24", "#d9f5f0", "#2dd4bf", "round"],
        ["Ultraviolet", "#10002b", "#efe3ff", "#c77dff", "sans"],
        ["Lava", "#1a0500", "#ffe3d6", "#ff5722", "sans"],
        ["Matcha Night", "#0d140a", "#eaf5dc", "#a3e635", "round"],
        ["Nord", "#2e3440", "#eceff4", "#88c0d0", "sans"],
        ["Dracula", "#282a36", "#f8f8f2", "#bd93f9", "mono"],
        ["Gruvbox", "#282828", "#ebdbb2", "#fabd2f", "mono"],
        ["Solarized", "#002b36", "#eee8d5", "#2aa198", "mono"],
        ["Tokyo Night", "#1a1b26", "#c0caf5", "#7aa2f7", "sans"],
        ["Mocha", "#1e1e2e", "#cdd6f4", "#f5c2e7", "round"],
        ["Monokai", "#272822", "#f8f8f2", "#a6e22e", "mono"],
        ["Synthwave", "#1b0a33", "#ffe9fb", "#ff3cac", "sans"],
        ["Cherry Blossom", "#1c1018", "#ffe8f1", "#ffb7d5", "serif"],
        ["Espresso", "#1a110c", "#f1e3d3", "#d9a066", "serif"],
        ["Slate Mint", "#0f172a", "#e2e8f0", "#5eead4", "sans"],
        ["Blueprint", "#0b2a4a", "#e6f0ff", "#ffd166", "mono"],
        ["Blood Moon", "#0b0b0b", "#f2f2f2", "#ff2d2d", "sans"],
        ["Plum Wine", "#1f0a1f", "#f9e6f9", "#e879f9", "serif"],
        ["Forest", "#0b1a10", "#e3f2e1", "#6fcf97", "serif"],
        ["Graphite", "#111418", "#e6e9ee", "#5b9dff", "sans"],
        ["Paper Blue", "#f6f6f3", "#1c1c1c", "#2f5bea", "sans"],
        ["Snow Mint", "#f2fbf7", "#0f2a22", "#077a54", "round"],
        ["Lavender Haze", "#f4f0ff", "#21163f", "#6d3ff2", "round"],
        ["Raspberry", "#fff2ee", "#3a1710", "#c92a5b", "sans"],
        ["Sky Day", "#eef7ff", "#0b2540", "#0b6bcb", "sans"],
        ["Butter", "#fffbe0", "#2b2600", "#7a5f00", "serif"],
        ["Bubblegum", "#fff0f7", "#3a0a24", "#c01f8a", "round"],
        ["Lime Soda", "#f6ffe5", "#1c2a00", "#4d7c0f", "sans"],
        ["Ink", "#ffffff", "#151515", "#e11d48", "mono"],
        ["Glacier", "#f0fbff", "#062a33", "#0e7490", "sans"],
        ["Orchid", "#fbf0ff", "#2d0a3d", "#a21caf", "serif"],
        ["Newsprint", "#efefe9", "#111111", "#c40000", "serif"],
        ["Blueprint Light", "#e8f1fb", "#0b2a4a", "#1d4ed8", "mono"],
        ["Matcha", "#eef3e2", "#1f2a14", "#3f6212", "serif"],
        ["Electric Blue", "#1328d6", "#ffffff", "#ffe14d", "sans"],
        ["Violet Pop", "#5b21c9", "#ffffff", "#ffe14d", "round"],
        ["Tangerine Pop", "#ff7a1a", "#1a0a00", "#1a0a00", "sans"],
        ["Hot Pink", "#ff7ab8", "#2a0016", "#2a0016", "round"],
        ["Sunshine", "#ffd60a", "#1a1500", "#1a1500", "sans"],
        ["Mint Pop", "#3ddc97", "#04281a", "#04281a", "round"],
        ["Cobalt Lime", "#0820dc", "#ffffff", "#c6ff3d", "mono"],
      ];
      var KEY = "hn-theme";
      var root = document.documentElement;
      var last = NaN;

      try { last = parseInt(localStorage.getItem(KEY), 10); } catch (e) {}
      var i = Math.floor(Math.random() * T.length);
      if (i === last) i = (i + 1 + Math.floor(Math.random() * (T.length - 1))) % T.length;
      try { localStorage.setItem(KEY, i); } catch (e) {}

      var t = T[i], bg = t[1], accent = t[3];
      root.style.setProperty("--bg", bg);
      root.style.setProperty("--fg", t[2]);
      root.style.setProperty("--accent", accent);
      root.style.colorScheme =
        (parseInt(bg.slice(1, 3), 16) * 299 + parseInt(bg.slice(3, 5), 16) * 587 + parseInt(bg.slice(5, 7), 16) * 114) / 1000 > 140
          ? "light" : "dark";
      root.setAttribute("data-theme", t[0]);
      root.setAttribute("data-font", t[4]);
      root.setAttribute("data-pattern", ["glow", "grid", "dots"][Math.floor(Math.random() * 3)]);

      document.querySelector("meta[name=theme-color]").content = bg;
      document.getElementById("icon").href = "data:image/svg+xml," + encodeURIComponent(
        '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">' +
        '<rect width="32" height="32" rx="9" fill="' + bg + '"/>' +
        '<circle cx="16" cy="16" r="9" fill="none" stroke="' + accent + '" stroke-width="5"/></svg>'
      );
    })();
  </script>

  <style>
    :root {
      --bg: #07101f;
      --fg: #e8f1ff;
      --accent: #3da5ff;
      --muted: color-mix(in srgb, var(--fg) 72%, var(--bg));
      --line: color-mix(in srgb, var(--fg) 14%, var(--bg));
      --secs: 5; /* countdown length; keep in sync with the noscript refresh above */
      --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --radius: 14px; /* button corners */
      --tracking: -.03em; /* tracking for the big domain name */
    }

    [data-font="mono"] {
      --font: ui-monospace, "SF Mono", "Cascadia Code", Consolas, "Liberation Mono", Menlo, monospace;
      --radius: 2px;
      --tracking: -.04em;
    }
    [data-font="serif"] {
      --font: ui-serif, "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
      --radius: 6px;
      --tracking: -.01em;
    }
    [data-font="round"] {
      --font: ui-rounded, "SF Pro Rounded", "Hiragino Maru Gothic ProN", Quicksand, Nunito, system-ui, sans-serif;
      --radius: 999px;
      --tracking: -.02em;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font);
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: clamp(20px, 5vw, 48px);
      -webkit-font-smoothing: antialiased;
    }

    /* Background pattern: one of three, chosen per visit. */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
    }
    [data-pattern="glow"] body::before {
      background: radial-gradient(60rem 36rem at 50% 0%, color-mix(in srgb, var(--accent) 24%, transparent), transparent 70%);
    }
    [data-pattern="grid"] body::before {
      background-image:
        linear-gradient(var(--line) 1px, transparent 1px),
        linear-gradient(90deg, var(--line) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse at 50% 42%, #000 0, transparent 72%);
    }
    [data-pattern="dots"] body::before {
      background-image: radial-gradient(var(--line) 1.5px, transparent 1.7px);
      background-size: 26px 26px;
      mask-image: radial-gradient(ellipse at 50% 42%, #000 0, transparent 72%);
    }

    main {
      width: 100%;
      max-width: 36rem;
      text-align: center;
      animation: in .5s ease-out both;
    }

    h1 { margin: 0; font-weight: 400; }

    .from {
      display: block;
      color: var(--muted);
      font-size: 1.05rem;
    }

    .to {
      display: block;
      margin-top: .2em;
      color: var(--accent);
      font-size: clamp(2.1rem, 10vw, 4rem);
      font-weight: 700;
      line-height: 1.05;
      letter-spacing: var(--tracking);
      overflow-wrap: anywhere;
    }

    .ring {
      position: relative;
      width: 7.5rem;
      aspect-ratio: 1;
      margin: clamp(24px, 6vh, 40px) auto;
    }
    .ring svg {
      display: block;
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }
    .ring circle { fill: none; stroke-width: 5; }
    .track { stroke: var(--line); }
    .bar {
      stroke: var(--accent);
      stroke-linecap: round;
      stroke-dasharray: 100; /* pathLength is 100 in the markup */
      animation: drain calc(var(--secs) * 1s) linear forwards;
    }
    .paused .bar { animation-play-state: paused; }
    .ring b {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 2.5rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 4px 20px;
    }

    .go {
      display: inline-flex;
      align-items: center;
      min-height: 48px;
      padding: 0 30px;
      border-radius: var(--radius);
      background: var(--accent);
      color: var(--bg);
      font-size: 1rem;
      font-weight: 700;
      text-decoration: none;
      transition: box-shadow .15s ease;
    }
    .go:hover { box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 25%, transparent); }
    .go:active { transform: translateY(1px); }

    .pause {
      min-height: 48px;
      padding: 0 8px;
      border: 0;
      background: none;
      color: var(--muted);
      font: inherit;
      font-size: .95rem;
      text-decoration: underline;
      text-underline-offset: .25em;
      cursor: pointer;
    }
    .pause:hover { color: var(--fg); }

    .go:focus-visible,
    .pause:focus-visible,
    .note a:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
    }

    .note {
      max-width: 30rem;
      margin: clamp(28px, 6vh, 44px) auto 0;
      color: var(--muted);
      font-size: .9rem;
      line-height: 1.65;
      text-wrap: balance;
    }
    .note a {
      color: var(--accent);
      font-weight: 600;
      text-underline-offset: .2em;
    }

    .theme {
      margin: 20px 0 0;
      color: var(--muted);
      font-size: .8rem;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    @keyframes in { from { opacity: 0; transform: translateY(8px); } }
    @keyframes drain { to { stroke-dashoffset: 100; } }

    @media (prefers-reduced-motion: reduce) {
      main { animation: none; }
      .bar { animation-timing-function: steps(var(--secs)); }
    }
  </style>
</head>

<body>
  <main>
    <h1>
      <span class="from">habibullah.net has moved to</span>
      <span class="to">habibullah.dev</span>
    </h1>

    <div class="ring" aria-hidden="true">
      <svg viewBox="0 0 100 100">
        <circle class="track" cx="50" cy="50" r="45" pathLength="100"></circle>
        <circle class="bar" cx="50" cy="50" r="45" pathLength="100"></circle>
      </svg>
      <b id="num">5</b>
    </div>
    <p class="sr-only" id="status" role="status">Redirecting to habibullah.dev in 5 seconds.</p>

    <div class="actions">
      <a class="go" id="go" href="https://habibullah.dev/">Go now</a>
      <button class="pause" id="pause" type="button">Pause</button>
    </div>

    <p class="note">
      habibullah.net is an extra domain I bought to protect my brand.
      If you have a real need for it, tell me why at
      <a href="mailto:hey@habibullah.dev">hey@habibullah.dev</a>.
    </p>

    <p class="theme" id="themeName"></p>
  </main>

  <script>
    (function () {
      var root = document.documentElement;
      var num = document.getElementById("num");
      var status = document.getElementById("status");
      var go = document.getElementById("go");
      var pause = document.getElementById("pause");

      var secs = parseFloat(getComputedStyle(root).getPropertyValue("--secs")) || 5;
      var remaining = secs * 1000;
      var deadline, timer, paused = false;

      // Keep the path, query and hash. Only the host changes.
      var target = "https://habibullah.dev" +
        location.pathname.replace(/\/index\.html$/, "/") + location.search + location.hash;
      go.href = target;

      document.getElementById("themeName").textContent = "Theme: " + root.getAttribute("data-theme");

      // replace() keeps this page out of history, so Back never lands in a redirect loop.
      function leave() { location.replace(target); }

      function tick() {
        remaining = deadline - performance.now();
        if (remaining <= 0) { clearInterval(timer); leave(); return; }
        var s = String(Math.ceil(remaining / 1000));
        if (num.textContent !== s) num.textContent = s;
      }

      function run() {
        deadline = performance.now() + remaining;
        timer = setInterval(tick, 100);
      }

      go.addEventListener("click", function (e) {
        if (e.button || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
        e.preventDefault();
        leave();
      });

      pause.addEventListener("click", function () {
        paused = !paused;
        if (paused) {
          clearInterval(timer);
          remaining = Math.max(deadline - performance.now(), 0);
        } else {
          run();
        }
        root.classList.toggle("paused", paused);
        pause.textContent = paused ? "Resume" : "Pause";
        status.textContent = paused ? "Countdown paused." : "Countdown resumed.";
      });

      run();
    })();
  </script>
</body>
</html>
